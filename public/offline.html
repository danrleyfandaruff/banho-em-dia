<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#7353a6" />
    <title>HEIN PET SALON · Sem conexão</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f3fb; color: #302638; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; border: 1px solid #e4dced; border-radius: 24px; background: #fffbff; text-align: center; box-shadow: 0 18px 60px rgba(91, 67, 116, .13); }
      .icon { display: grid; width: 64px; height: 64px; margin: 0 auto 20px; place-items: center; border-radius: 18px; background: #7353a6; color: white; font-size: 32px; }
      h1 { margin: 0 0 10px; font-size: 24px; }
      p { margin: 0; color: #786b82; line-height: 1.6; }
      button { margin-top: 22px; min-height: 44px; border: 0; border-radius: 12px; padding: 0 20px; background: #7353a6; color: white; font: inherit; font-weight: 800; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="icon" aria-hidden="true">🐾</div>
      <h1>Sem conexão com a internet</h1>
      <p>A agenda precisa estar online para carregar e salvar os atendimentos.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
